<script>

const figures=[['Landing approach',45,50,'Handbook approximate approach'],['Stall reference',31,null,'At 570 lb all-up; EAS'],['Best glide',43,null,'Calculated EAS'],['Minimum sink',37,null,'Calculated EAS'],['Winch / auto-tow MAX',55,null,'Limit, not takeoff target'],['Aerotow MAX',75,null,'Limit, not takeoff target'],['Rough air MAX',75,null,'Speed limit'],['Calm air MAX',110,null,'Speed limit']];
const fmt=n=>db.unit==='kt'?n:Math.round(n*1.852),units=()=>db.unit==='kt'?'kt':'km/h';
function render(){save();let craft=a(),m=$('main');$('lockBtn').textContent=db.locked?'🔒 Locked':'🔓 Lock';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===db.tab));
if(db.tab==='home')m.innerHTML='<div class="muted">YOUR PERSONAL AVIATION COMPANION</div><h1>Ready when you are.</h1><div class="card"><div class="topline"><h2>'+safe(craft.name)+'</h2><span class="tag '+(db.locked?'locked':'')+'">'+(db.locked?'LOCKED':'UNLOCKED')+'</span></div><p class="muted">Registration: '+safe(craft.reg||'Not entered')+'</p><button class="btn full" onclick="go(\'performance\')">Review performance →</button><p><button class="btn alt full" onclick="go(\'checks\')">Open checklist →</button></p></div><p class="hint"><b>Reference only.</b> Verify aircraft identity, variant, serial number, current placards, approved flight manual and technical notes before use. This app is not an instrument or approved checklist.</p>';
if(db.tab==='performance'){const custom=craft.id!=='ka6cr';m.innerHTML='<div class="topline"><div><div class="muted">AIRCRAFT REFERENCE</div><h1>Performance</h1></div><span class="tag '+(db.locked?'locked':'')+'">'+(db.locked?'🔒 LOCKED':'UNLOCKED')+'</span></div><div class="panel"><b>'+safe(craft.name)+'</b><div class="muted">'+safe(craft.reg||'Registration not entered')+'</div></div><p class="stack"><button class="btn '+(db.unit==='kt'?'':'alt')+'" onclick="setUnit(\'kt\')">Knots</button><button class="btn '+(db.unit==='kmh'?'':'alt')+'" onclick="setUnit(\'kmh\')">km/h</button></p>'+ (custom?'<p class="hint">No validated performance data for this aircraft. Do not use KA 6 figures for another aircraft.</p>': '<div class="cards">'+figures.map(f=>'<div class="metric"><small>'+f[0]+'</small><b>'+fmt(f[1])+(f[2]?'–'+fmt(f[2]):'')+'</b><span>'+units()+' · '+f[3]+'</span></div>').join('')+'</div><div class="card"><small>Maximum all-up weight</small><h2>'+(db.unit==='kt'?'660 lb':'299 kg')+'</h2><div class="muted">Handbook reference; verify aircraft loading and placards.</div></div><div class="stack"><button class="btn" onclick="speak()">▶ Review performance aloud</button><button class="btn alt" onclick="speechSynthesis.cancel()">■ Stop</button></div><p class="muted">Source: <a href="https://flyavm.it/manuali/KA6CR_handbook.pdf" target="_blank" rel="noopener">KA 6 CR handbook</a>. Values are handbook references, not live speeds. Stall is given at one specified weight; best-glide/min-sink values are calculated EAS, not necessarily cockpit IAS.</p>')}
if(db.tab==='checks'){
let p=craft.phases[db.phase]||craft.phases[0];if(!p){m.innerHTML='<h1>No checklist phases</h1>';return}

let total=craft.phases.reduce((n,x)=>n+x.items.length,0);
let done=craft.phases.reduce((n,x,i)=>n+x.items.filter((y,j)=>db.ticks[key(i,j)]).length,0);
let unresolved=craft.phases.reduce((n,x,i)=>n+x.items.filter((y,j)=>db.issues[key(i,j)]?.status==='open').length,0);
let phaseOpen=p.items.filter((y,j)=>db.issues[key(db.phase,j)]?.status==='open').length;
let phasePending=p.items.filter((y,j)=>!db.ticks[key(db.phase,j)]).length;
m.innerHTML='<div class="muted">'+safe(craft.name)+' / '+safe(craft.reg||'No registration')+'</div><div class="compact-head"><h1>Checklist</h1><span class="tag">'+done+'/'+total+' checked</span></div><div class="bar"><div class="fill" style="width:'+100*done/Math.max(total,1)+'%"></div></div>'+
'<select aria-label="Flight phase" onchange="selectPhase(this.value)">'+craft.phases.map((x,i)=>'<option value="'+i+'" '+(i===db.phase?'selected':'')+'>'+safe(x.name)+'</option>').join('')+'</select>'+
'<div class="card" style="padding:12px;margin-top:3px"><div class="topline"><div><div class="muted">MEMORY CUE</div><b style="font-size:19px">'+safe(p.cue)+'</b></div><span class="phase-status">'+(p.items.length-phasePending)+'/'+p.items.length+' complete</span></div>'+
p.items.map((x,j)=>{let issue=db.issues[key(db.phase,j)],pass=!!db.ticks[key(db.phase,j)],open=issue?.status==='open',k=key(db.phase,j);return '<div class="compact-check"><span class="item-name">'+safe(x)+'</span><button class="mini-action '+(pass?'ok':'')+'" onclick="markPass('+j+')" aria-label="Mark pass">'+(pass?'✓ Pass':'✓')+'</button><button class="mini-action '+(open?'warn':'')+'" onclick="flagIssue('+j+')" aria-label="Flag warning">⚠</button></div>'+
(open?'<div class="issue"><strong>⚠ HOLD — unresolved issue</strong><p>'+safe(issue.description||'Issue reported. Inspection not satisfactory.')+'</p><label>Corrective action / assessment record</label><textarea id="solution-'+j+'" placeholder="What was corrected and how was it verified?">'+safe(issue.solution||'')+'</textarea><label>Verification by authorised person / pilot according to approved procedures</label><input type="text" id="verified-'+j+'" value="'+safe(issue.verifiedBy||'')+'" placeholder="Name / reference"><button class="btn sm" onclick="resolveIssue('+j+')">Record rectification & reinspection</button><p class="muted">Reinspection must be actually satisfactory. Writing a note does not establish airworthiness. If uncertain, stop and consult authorised maintenance personnel.</p></div>':'')}).join('')+'</div>'+
(unresolved?'<div class="blocked">⚠ '+unresolved+' unresolved warning(s) across the checklist. Progression, finalisation and flight readiness are blocked.</div>':'')+
(phasePending&&!unresolved?'<div class="hint">'+phasePending+' item(s) have not been confirmed. Complete each before proceeding.</div>':'')+
'<div class="stack"><button class="btn alt" onclick="phaseMove(-1)" '+(db.phase===0?'disabled':'')+'>← Previous</button><button class="btn" onclick="phaseMove(1)" '+(db.phase===craft.phases.length-1||unresolved||phasePending?'disabled':'')+'>Next phase →</button><button class="btn alt" onclick="finish()" '+(unresolved||done!==total?'disabled':'')+'>Save complete record</button></div><p class="muted">This is a pilot memory aid, not a certified aircraft release. Use on ground or only when safe and workload permits.</p>';
}
if(db.tab==='timer'){
db.flights=db.flights||[];const running=!!db.timer,forCurrent=running&&db.timer.aircraftId===craft.id;
m.innerHTML='<div class="muted">FLIGHT TIME · '+safe(craft.name)+'</div><h1>Flight Timer</h1>'+
'<div class="card"><div class="topline"><b>'+safe(craft.name)+'</b><span class="tag '+(running?'locked':'')+'">'+(running?'RUNNING':'STOPPED')+'</span></div><div class="muted">Registration: '+safe(craft.reg||'Not set')+'</div>'+
'<div id="timerDisplay" class="timer-digits">'+timerText()+'</div>'+
'<div class="stack"><button class="btn" onclick="startTimer()" '+(running||!db.locked||!craft.reg?'disabled':'')+'>▶ Start flight</button><button class="btn danger" onclick="stopTimer()" '+(!forCurrent?'disabled':'')+'>■ Stop flight</button></div>'+
(!db.locked?'<p class="hint">Lock the verified aircraft profile before starting the timer.</p>':'')+
'<p class="muted">Manual elapsed-time log, not an official flight-time recording instrument. The clock counts from the start timestamp even if the app is closed; verify the actual times after landing.</p></div>'+
'<h2>Recent flight records</h2>'+db.flights.filter(x=>x.aircraftId===craft.id).slice(-10).reverse().map(x=>'<div class="card" style="padding:12px"><div class="topline"><b>'+safe(new Date(x.startedAt).toLocaleDateString())+'</b><b>'+safe(formatDuration(x.durationMs))+'</b></div><div class="muted">'+safe(new Date(x.startedAt).toLocaleTimeString())+' – '+safe(new Date(x.stoppedAt).toLocaleTimeString())+' · '+safe(x.registration||'')+'</div></div>').join('')+
'<button class="btn alt full" onclick="exportData()">Export flight history & checklists (JSON)</button>';
}
if(db.tab==='airport'){
db.airports=db.airports||{};let ap=db.airports[db.selected]||{},e=Number(ap.elevation),d=Number(ap.downwind),validE=ap.elevation!==''&&ap.elevation!=null&&Number.isFinite(e),validD=ap.downwind!==''&&ap.downwind!=null&&Number.isFinite(d);
let diff=validE&&validD?Math.round(d-e):null;
m.innerHTML='<div class="muted">AERODROME · '+safe(craft.name)+'</div><h1>Airfield & circuit plan</h1>'+
'<div class="card"><div class="topline"><b>'+safe(ap.name||'Select an airfield')+'</b><span class="tag">'+(ap.checked?'Plan noted':'Not verified')+'</span></div>'+
'<label>ICAO code (if available)</label><input id="ap-icao" type="text" maxlength="5" placeholder="e.g. FAxx" value="'+safe(ap.icao||'')+'">'+
'<label>Airfield name</label><input id="ap-name" type="text" maxlength="100" placeholder="Aerodrome name" value="'+safe(ap.name||'')+'">'+
'<div class="air-field"><div><label>Elevation (ft AMSL)</label><input id="ap-elevation" type="number" step="1" placeholder="Verified elevation" value="'+safe(ap.elevation??'')+'"></div><div><label>Runway selected</label><input id="ap-runway" type="text" maxlength="8" placeholder="02" value="'+safe(ap.runway||'')+'"></div></div>'+
'<div class="air-field"><div><label>Planned downwind (ft AMSL)</label><input id="ap-downwind" type="number" step="1" placeholder="4700" value="'+safe(ap.downwind??'')+'"></div><div><label>Circuit direction</label><select id="ap-direction"><option value="">Not selected</option><option value="Left" '+(ap.direction==='Left'?'selected':'')+'>Left</option><option value="Right" '+(ap.direction==='Right'?'selected':'')+'>Right</option></select></div></div>'+
'<label>Airfield-specific notes / constraints</label><textarea id="ap-notes" rows="3" placeholder="Local procedures, circuit restrictions, NOTAMs to check">'+safe(ap.notes||'')+'</textarea>'+

'<div class="cards"><div class="metric"><small>Airfield elevation</small><b>'+(validE?e.toLocaleString():'—')+'</b><span>ft AMSL</span></div><div class="metric"><small>Planned downwind</small><b>'+(validD?d.toLocaleString():'—')+'</b><span>ft AMSL</span></div></div>'+
'<div class="airport-readout"><div class="muted">PLANNED HEIGHT ABOVE AIRFIELD</div><div class="airport-value">'+(diff===null?'—':diff.toLocaleString()+' ft AAL')+'</div><div class="airport-sub">'+(diff===null?'Enter both elevation and downwind altitude':diff<=0?'⚠ Planned altitude is not above airfield elevation':'Calculated by subtracting airfield elevation from planned downwind altitude')+'</div></div>'+

function go(t){db.tab=t;render()}
function setUnit(x){db.unit=x;render()}
function hasOpenIssues(){return Object.values(db.issues||{}).some(x=>x.status==='open'&&x.aircraftId===db.selected)}
function phaseComplete(i){let p=a().phases[i];return p&&p.items.every((_,j)=>db.ticks[key(i,j)]&&! (db.issues?.[key(i,j)]?.status==='open'))}
function selectPhase(v){let target=Number(v);if(target>db.phase && (!phaseComplete(db.phase)||hasOpenIssues())){alert('HOLD: Complete the current phase and resolve all warnings before proceeding.');render();return}db.phase=target;render()}
function phaseMove(v){if(v>0&&(!phaseComplete(db.phase)||hasOpenIssues())){alert('HOLD: Reinspect and resolve warnings before moving forward.');return}db.phase=Math.max(0,Math.min(a().phases.length-1,db.phase+v));render()}
function markPass(j){let k=key(db.phase,j);if(db.issues?.[k]?.status==='open'){alert('Issue unresolved. Record corrective action and satisfactory reinspection before marking Pass.');return}db.ticks[k]=!db.ticks[k];render()}
function flagIssue(j){let k=key(db.phase,j);db.issues=db.issues||{};if(db.issues[k]?.status==='open'){document.getElementById('solution-'+j)?.focus();return}
let details=prompt('Describe the unsatisfactory condition. Do not fly if safety is in question:');if(!details?.trim())return;
db.issues[k]={aircraftId:db.selected,phase:db.phase,item:j,description:details.trim(),solution:'',verifiedBy:'',status:'open',reportedAt:new Date().toISOString()};db.ticks[k]=false;render()}
function resolveIssue(j){let k=key(db.phase,j),issue=db.issues?.[k];if(!issue||issue.status!=='open')return;let solution=document.getElementById('solution-'+j)?.value.trim(),by=document.getElementById('verified-'+j)?.value.trim();
if(!solution||!by){alert('Provide corrective-action details and the person responsible for verifying it.');return}
if(!confirm('Confirm that the issue was actually rectified, any required authorised maintenance release was completed, and the item was independently rechecked satisfactorily. A typed note is not evidence of airworthiness.'))return;
issue.solution=solution;issue.verifiedBy=by;issue.status='resolved';issue.resolvedAt=new Date().toISOString();db.ticks[k]=false;render();alert('Resolution recorded. Re-check this item and mark Pass before proceeding.')}
function formatDuration(ms){let t=Math.max(0,Math.floor(ms/1000));return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(v=>String(v).padStart(2,'0')).join(':')}
function timerText(){return db.timer?formatDuration(Date.now()-db.timer.startedAt):'00:00:00'}
function startTimer(){if(db.timer){alert('A flight timer is already running.');return}if(!db.locked||!a().reg){alert('Verify and lock the selected aircraft with its registration before starting.');return}
if(hasOpenIssues()){alert('HOLD: unresolved checklist defects have been recorded. Do not begin the flight timer as a readiness indicator.');return}
if(!confirm('Start elapsed-time log for '+a().name+' / '+a().reg+'? This does not certify readiness to fly.'))return;
db.timer={aircraftId:db.selected,aircraftName:a().name,registration:a().reg,startedAt:Date.now()};render()}
function stopTimer(){if(!db.timer||db.timer.aircraftId!==db.selected)return;if(!confirm('Stop the elapsed-time log and record the flight?'))return;let t=db.timer;let ended=Date.now();db.flights=db.flights||[];db.flights.push({...t,stoppedAt:ended,durationMs:Math.max(0,ended-t.startedAt)});db.timer=null;render()}
setInterval(()=>{let el=document.getElementById('timerDisplay');if(el&&db.tab==='timer')el.textContent=timerText()},1000);

function selectAircraft(id){if(db.locked||db.timer)return;db.selected=id;db.phase=0;render()}function changeReg(){if(db.locked)return;a().reg=$('reg').value.trim();render()}
function toggleLock(){if(db.timer){alert('Stop the flight timer before unlocking or switching aircraft.');return}if(db.locked){if(prompt('On the ground? Type UNLOCK to change the aircraft profile:')!=='UNLOCK')return;db.locked=false}else{if(!a().reg){alert('Enter and save aircraft registration first.');go('manage');return}if(!confirm('Verify the aircraft type and registration against its placards, then lock this profile?'))return;db.locked=true}render()}
function saveAirport(){if(db.locked||db.timer){alert('Aircraft/airfield planning is locked during this flight. Stop the timer and unlock the aircraft on the ground to edit.');return}
const id=x=>document.getElementById(x).value.trim(),number=x=>{const s=id(x);return s===''?null:Number(s)};
let ele=number('ap-elevation'),dw=number('ap-downwind');if((ele!==null&&(!Number.isFinite(ele)||ele< -1500||ele>30000))||(dw!==null&&(!Number.isFinite(dw)||dw< -1500||dw>40000))){alert('Enter valid elevations in feet or leave the field blank.');return}
let icao=id('ap-icao').toUpperCase(),name=id('ap-name'),runway=id('ap-runway').toUpperCase();
if(runway&&!/^(0[1-9]|[12][0-9]|3[0-6])([LRC])?$/.test(runway)){alert('Use a runway designator such as 02, 20, 02L.');return}
db.airports=db.airports||{};db.airports[db.selected]={icao,name,runway,elevation:ele,downwind:dw,direction:id('ap-direction'),notes:id('ap-notes'),checked:false,savedAt:new Date().toISOString()};render()}
function lookupAirport(){let q=(document.getElementById('ap-icao')?.value||document.getElementById('ap-name')?.value||'').trim();if(!q){alert('Enter an ICAO code or airfield name first.');return}window.open('https://ourairports.com/search/?q='+encodeURIComponent(q),'_blank','noopener')}
function newAircraft(){if(db.locked||db.timer)return;let name=prompt('New aircraft/checklist name:');if(!name?.trim())return;let id='custom-'+Date.now();db.aircraft.push({id,name:name.trim().slice(0,90),reg:'',archived:false,phases:[{name:'Before flight',cue:'VERIFY',items:['Review approved procedures']} ]});db.selected=id;db.phase=0;render()}
function addPhase(){if(db.locked||db.timer)return;let name=prompt('New phase name:');if(!name?.trim())return;let cue=prompt('Memory cue (optional):')||'';a().phases.push({name:name.trim(),cue,items:[]});db.phase=a().phases.length-1;render()}
function addItem(){if(db.locked||db.timer)return;let name=prompt('New checklist item for '+a().phases[db.phase].name+':');if(!name?.trim())return;a().phases[db.phase].items.push(name.trim());render()}
function archive(id){if(db.locked||db.timer)return;let x=db.aircraft.find(y=>y.id===id);if(!x)return;if(!x.archived&&db.aircraft.filter(y=>!y.archived).length===1){alert('Keep at least one active checklist.');return}x.archived=!x.archived;if(x.archived&&db.selected===id)db.selected=db.aircraft.find(y=>!y.archived).id;db.phase=0;render()}
function remove(id){if(db.locked||db.timer)return;if(db.aircraft.length===1){alert('Keep at least one checklist.');return}let x=db.aircraft.find(y=>y.id===id);if(!confirm('Permanently delete '+x.name+'?'))return;if(prompt('Type DELETE to confirm:')!=='DELETE')return;db.aircraft=db.aircraft.filter(y=>y.id!==id);if(db.selected===id)db.selected=db.aircraft[0].id;db.phase=0;render()}
function finish(){if(hasOpenIssues()||!a().phases.every((_,i)=>phaseComplete(i))){alert('Checklist cannot be finalised. Resolve all issues and verify every item.');return}db.sessions.push({date:new Date().toISOString(),aircraft:a().name,registration:a().reg,ticks:{...db.ticks}});save();alert('Checklist snapshot saved locally. This is not an aircraft release.')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='flightcheck-backup.json';el.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function speak(){if(a().id!=='ka6cr'||!('speechSynthesis' in window)){alert('Voice reading unavailable for this profile/device');return}speechSynthesis.cancel();let tx='Schleicher K A 6 C R. '+figures.map(f=>f[0]+': '+fmt(f[1])+(f[2]?' to '+fmt(f[2]):'')+' '+(db.unit==='kt'?'knots':'kilometres per hour')+'. '+f[3]+'.').join(' ')+' Maximum all up weight: '+(db.unit==='kt'?'660 pounds':'299 kilograms')+'. Reference only. Verify your aircraft documentation.';let u=new SpeechSynthesisUtterance(tx);u.rate=.86;u.lang='en-GB';speechSynthesis.speak(u)}

else{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});await authenticated(data)}}catch(err){message(err.message)}finally{btn.disabled=false}});
