<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>FlightCheck | Aviation Checklists</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#142538;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:20px 18px 100px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.mark{background:#123550;color:white;border-radius:15px;padding:11px}.muted{color:#69798c;font-size:13px}.card{border:1px solid #e1e8f0;border-radius:20px;padding:17px;margin:12px 0;background:white;box-shadow:0 6px 26px #14253806}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f5f8fb;border-radius:16px;padding:15px}.metric b{font-size:27px;display:block;line-height:1.35}.metric small{font-size:12px;color:#728294}.metric span{font-size:12px;color:#728294}.btn{background:#153e60;color:white;border:0;border-radius:13px;padding:12px 15px;font-weight:650}.btn.alt{background:#edf3f7;color:#153e60}.btn.danger{background:#fff1f1;color:#a82331}.btn.sm{font-size:12px;padding:9px}.stack{display:flex;gap:8px;flex-wrap:wrap}.full{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:11px 10px max(12px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e1e7ed;display:flex;justify-content:space-around;z-index:4}.nav button{border:0;background:none;color:#69798c;padding:8px 11px;border-radius:12px;font-size:12px;font-weight:700}.nav button.active{background:#e9f1f7;color:#153e60}h1{font-size:26px;letter-spacing:-.8px;margin:8px 0}h2{font-size:19px;margin:0 0 10px}p{line-height:1.5}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;font-weight:700;padding:6px 9px;border-radius:20px;background:#eef3f7;color:#345}.tag.locked{background:#e5f4e8;color:#176c38}.bar{height:8px;background:#e6edf2;border-radius:20px;overflow:hidden}.fill{height:100%;background:#153e60}.check{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #ebeff2}.check input{width:24px;height:24px;accent-color:#153e60}.check span{flex:1}.panel{background:#f6f9fb;padding:14px;border-radius:15px}.hidden{display:none!important}input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;padding:12px;border:1px solid #d7e0e8;border-radius:12px;background:#fff;margin:5px 0 12px}label{display:block;font-size:12px;font-weight:700;color:#52647a}.hint{background:#fff9e8;padding:12px;border-radius:12px;border:1px solid #f3e7c0;font-size:12px;color:#6c5d25}.fade{animation:rise .25s ease-out}@keyframes rise{from{opacity:.1;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}a{color:#145481}
</style></head><body><div class="app">
<header class="header"><div class="logo"><div class="mark">✈</div> FlightCheck</div><button class="btn alt sm" id="lockBtn">🔒 Lock</button></header>
<main id="main" class="fade"></main>
<nav class="nav"><button data-tab="home">⌂<br>Home</button><button data-tab="checks">☑<br>Checks</button><button data-tab="performance">◉<br>Performance</button><button data-tab="manage">☷<br>Manage</button></nav></div>
<script>
const STORE='flightcheck-pages-v1';
const ka={id:'ka6cr',name:'Schleicher KA 6 CR',reg:'',archived:false,verified:false,phases:[{name:'Preflight',cue:'AIRFRAME',items:['Documents and maintenance status','Rigging and secure connections','Wings, tail and controls','Tyre and airbrakes']},{name:'Cockpit / Before launch',cue:'CBSIFTBEC',items:['Controls full and free','Ballast and weight assessed','Straps secure','Instruments checked','Flaps if fitted','Trim checked','Brakes operated, closed and locked','Eventualities and launch-failure plan','Canopy closed and locked']},{name:'Tow / Launch',cue:'CONTROL · LOOKOUT',items:['Launch conditions considered','Approved launch procedures reviewed']},{name:'Free flight',cue:'LOOK · SPEED · HEIGHT',items:['Lookout maintained','Airspeed and height monitored','Landing options reviewed']},{name:'Circuit',cue:'WIND · HEIGHT · TRAFFIC',items:['Wind and landing area checked','Traffic and circuit plan considered']},{name:'Approach / Landing',cue:'SPEED · PATH',items:['Approach speed reviewed','Approach and airbrakes managed under approved procedures']},{name:'Post-flight',cue:'SECURE · RECORD',items:['Airframe condition checked','Defects recorded and reported']}]};
let db;try{db=JSON.parse(localStorage.getItem(STORE))}catch(e){}if(!db||!Array.isArray(db.aircraft))db={aircraft:[ka],selected:'ka6cr',locked:false,tab:'home',phase:0,unit:'kt',ticks:{},sessions:[]};
if(!db.aircraft.length)db.aircraft=[ka];if(!db.aircraft.find(x=>x.id===db.selected))db.selected=db.aircraft[0].id;
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(STORE,JSON.stringify(db)),a=()=>db.aircraft.find(x=>x.id===db.selected),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=(i,j)=>db.selected+':'+i+':'+j;
const figures=[['Landing approach',45,50,'Handbook approximate approach'],['Stall reference',31,null,'At 570 lb all-up; EAS'],['Best glide',43,null,'Calculated EAS'],['Minimum sink',37,null,'Calculated EAS'],['Winch / auto-tow MAX',55,null,'Limit, not takeoff target'],['Aerotow MAX',75,null,'Limit, not takeoff target'],['Rough air MAX',75,null,'Speed limit'],['Calm air MAX',110,null,'Speed limit']];
const fmt=n=>db.unit==='kt'?n:Math.round(n*1.852),units=()=>db.unit==='kt'?'kt':'km/h';
function render(){save();let craft=a(),m=$('main');$('lockBtn').textContent=db.locked?'🔒 Locked':'🔓 Lock';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===db.tab));
if(db.tab==='home')m.innerHTML='<div class="muted">YOUR PERSONAL AVIATION COMPANION</div><h1>Ready when you are.</h1><div class="card"><div class="topline"><h2>'+safe(craft.name)+'</h2><span class="tag '+(db.locked?'locked':'')+'">'+(db.locked?'LOCKED':'UNLOCKED')+'</span></div><p class="muted">Registration: '+safe(craft.reg||'Not entered')+'</p><button class="btn full" onclick="go(\'performance\')">Review performance →</button><p><button class="btn alt full" onclick="go(\'checks\')">Open checklist →</button></p></div><p class="hint"><b>Reference only.</b> Verify aircraft identity, variant, serial number, current placards, approved flight manual and technical notes before use. This app is not an instrument or approved checklist.</p>';
if(db.tab==='performance'){const custom=craft.id!=='ka6cr';m.innerHTML='<div class="topline"><div><div class="muted">AIRCRAFT REFERENCE</div><h1>Performance</h1></div><span class="tag '+(db.locked?'locked':'')+'">'+(db.locked?'🔒 LOCKED':'UNLOCKED')+'</span></div><div class="panel"><b>'+safe(craft.name)+'</b><div class="muted">'+safe(craft.reg||'Registration not entered')+'</div></div><p class="stack"><button class="btn '+(db.unit==='kt'?'':'alt')+'" onclick="setUnit(\'kt\')">Knots</button><button class="btn '+(db.unit==='kmh'?'':'alt')+'" onclick="setUnit(\'kmh\')">km/h</button></p>'+ (custom?'<p class="hint">No validated performance data for this aircraft. Do not use KA 6 figures for another aircraft.</p>': '<div class="cards">'+figures.map(f=>'<div class="metric"><small>'+f[0]+'</small><b>'+fmt(f[1])+(f[2]?'–'+fmt(f[2]):'')+'</b><span>'+units()+' · '+f[3]+'</span></div>').join('')+'</div><div class="card"><small>Maximum all-up weight</small><h2>'+(db.unit==='kt'?'660 lb':'299 kg')+'</h2><div class="muted">Handbook reference; verify aircraft loading and placards.</div></div><div class="stack"><button class="btn" onclick="speak()">▶ Review performance aloud</button><button class="btn alt" onclick="speechSynthesis.cancel()">■ Stop</button></div><p class="muted">Source: <a href="https://flyavm.it/manuali/KA6CR_handbook.pdf" target="_blank" rel="noopener">KA 6 CR handbook</a>. Values are handbook references, not live speeds. Stall is given at one specified weight; best-glide/min-sink values are calculated EAS, not necessarily cockpit IAS.</p>')}
if(db.tab==='checks'){let p=craft.phases[db.phase]||craft.phases[0];if(!p){m.innerHTML='<h1>No checklist phases</h1>';return}let total=craft.phases.reduce((n,x)=>n+x.items.length,0),done=craft.phases.reduce((n,x,i)=>n+x.items.filter((y,j)=>db.ticks[key(i,j)]).length,0);m.innerHTML='<div class="muted">'+safe(craft.name)+' / '+safe(craft.reg||'No registration')+'</div><h1>Checklist</h1><div class="topline"><b>'+done+' of '+total+' completed</b><span class="tag">'+Math.round(100*done/Math.max(total,1))+'%</span></div><div class="bar"><div class="fill" style="width:'+100*done/Math.max(total,1)+'%"></div></div><p><select onchange="selectPhase(this.value)">'+craft.phases.map((x,i)=>'<option value="'+i+'" '+(i===db.phase?'selected':'')+'>'+safe(x.name)+'</option>').join('')+'</select></p><div class="card"><div class="muted">MEMORY PROMPT</div><h2>'+safe(p.cue)+'</h2>'+p.items.map((x,j)=>'<label class="check"><input type="checkbox" '+(db.ticks[key(db.phase,j)]?'checked':'')+' onchange="tick('+j+',this.checked)"><span>'+safe(x)+'</span></label>').join('')+'</div><div class="stack"><button class="btn alt" onclick="phaseMove(-1)" '+(db.phase===0?'disabled':'')+'>← Previous</button><button class="btn" onclick="phaseMove(1)" '+(db.phase===craft.phases.length-1?'disabled':'')+'>Next phase →</button><button class="btn alt" onclick="finish()">Save record</button></div><p class="hint">For flight reference, consult only when workload permits. Do not interact with the phone during critical flight phases.</p>'}
if(db.tab==='manage')m.innerHTML='<div class="muted">YOUR LIBRARY</div><h1>Aircraft & checklists</h1><div class="card"><label>Selected aircraft</label><select id="acselect" '+(db.locked?'disabled':'')+' onchange="selectAircraft(this.value)">'+db.aircraft.filter(x=>!x.archived).map(x=>'<option value="'+safe(x.id)+'" '+(x.id===db.selected?'selected':'')+'>'+safe(x.name)+'</option>').join('')+'</select><label>Aircraft registration</label><input id="reg" type="text" maxlength="30" value="'+safe(craft.reg||'')+'" '+(db.locked?'disabled':'')+'><button class="btn alt" '+(db.locked?'disabled':'')+' onclick="changeReg()">Save registration</button></div><div class="stack"><button class="btn" '+(db.locked?'disabled':'')+' onclick="newAircraft()">+ Add checklist</button><button class="btn alt" '+(db.locked?'disabled':'')+' onclick="addPhase()">+ Add phase</button><button class="btn alt" '+(db.locked?'disabled':'')+' onclick="addItem()">+ Add item</button></div><h2 style="margin-top:22px">Active / archived</h2>'+db.aircraft.map(x=>'<div class="card"><div class="topline"><b>'+safe(x.name)+'</b><span class="tag">'+(x.archived?'Archived':'Active')+'</span></div><p class="stack"><button class="btn alt sm" onclick="archive(\''+x.id+'\')" '+(db.locked?'disabled':'')+'>'+(x.archived?'Restore':'Archive')+'</button><button class="btn danger sm" onclick="remove(\''+x.id+'\')" '+(db.locked?'disabled':'')+'>Delete</button></p></div>').join('')+'<div class="card"><button class="btn alt full" onclick="exportData()">Export JSON backup</button><p class="muted">Locally saved on this browser/device. Signing into another phone does not sync data.</p></div>';
m.classList.remove('fade');void m.offsetWidth;m.classList.add('fade')}
function go(t){db.tab=t;render()}function setUnit(x){db.unit=x;render()}function selectPhase(v){db.phase=+v;render()}function phaseMove(v){db.phase=Math.max(0,Math.min(a().phases.length-1,db.phase+v));render()}function tick(j,v){db.ticks[key(db.phase,j)]=v;render()}
function selectAircraft(id){if(db.locked)return;db.selected=id;db.phase=0;render()}function changeReg(){if(db.locked)return;a().reg=$('reg').value.trim();render()}
function toggleLock(){if(db.locked){if(prompt('On the ground? Type UNLOCK to change the aircraft profile:')!=='UNLOCK')return;db.locked=false}else{if(!a().reg){alert('Enter and save aircraft registration first.');go('manage');return}if(!confirm('Verify the aircraft type and registration against its placards, then lock this profile?'))return;db.locked=true}render()}
function newAircraft(){if(db.locked)return;let name=prompt('New aircraft/checklist name:');if(!name?.trim())return;let id='custom-'+Date.now();db.aircraft.push({id,name:name.trim().slice(0,90),reg:'',archived:false,phases:[{name:'Before flight',cue:'VERIFY',items:['Review approved procedures']} ]});db.selected=id;db.phase=0;render()}
function addPhase(){if(db.locked)return;let name=prompt('New phase name:');if(!name?.trim())return;let cue=prompt('Memory cue (optional):')||'';a().phases.push({name:name.trim(),cue,items:[]});db.phase=a().phases.length-1;render()}
function addItem(){if(db.locked)return;let name=prompt('New checklist item for '+a().phases[db.phase].name+':');if(!name?.trim())return;a().phases[db.phase].items.push(name.trim());render()}
function archive(id){if(db.locked)return;let x=db.aircraft.find(y=>y.id===id);if(!x)return;if(!x.archived&&db.aircraft.filter(y=>!y.archived).length===1){alert('Keep at least one active checklist.');return}x.archived=!x.archived;if(x.archived&&db.selected===id)db.selected=db.aircraft.find(y=>!y.archived).id;db.phase=0;render()}
function remove(id){if(db.locked)return;if(db.aircraft.length===1){alert('Keep at least one checklist.');return}let x=db.aircraft.find(y=>y.id===id);if(!confirm('Permanently delete '+x.name+'?'))return;if(prompt('Type DELETE to confirm:')!=='DELETE')return;db.aircraft=db.aircraft.filter(y=>y.id!==id);if(db.selected===id)db.selected=db.aircraft[0].id;db.phase=0;render()}
function finish(){db.sessions.push({date:new Date().toISOString(),aircraft:a().name,registration:a().reg,ticks:{...db.ticks}});save();alert('Checklist snapshot saved locally. This is not an aircraft release.')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='flightcheck-backup.json';el.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function speak(){if(a().id!=='ka6cr'||!('speechSynthesis' in window)){alert('Voice reading unavailable for this profile/device');return}speechSynthesis.cancel();let tx='Schleicher K A 6 C R. '+figures.map(f=>f[0]+': '+fmt(f[1])+(f[2]?' to '+fmt(f[2]):'')+' '+(db.unit==='kt'?'knots':'kilometres per hour')+'. '+f[3]+'.').join(' ')+' Maximum all up weight: '+(db.unit==='kt'?'660 pounds':'299 kilograms')+'. Reference only. Verify your aircraft documentation.';let u=new SpeechSynthesisUtterance(tx);u.rate=.86;u.lang='en-GB';speechSynthesis.speak(u)}
$('lockBtn').onclick=toggleLock;document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>go(x.dataset.tab));render();
</script></body></html>
